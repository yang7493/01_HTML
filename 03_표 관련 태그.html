<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
    표를 만드는 태그는
    table, tr, th, td 가 있다.
    table: 기본적인 표를 생성 
    tr: 표의 행을 나타내는 태그
    th: 표의 제목을 나타내는 태그
    td: 표에 들어갈 데이터를 나타내는 태그
    -->
    <table border="2">
        <tr>
            <th>1</th>
            <th>2</th>
            <th>3</th>
        </tr>
        <tr>
            <th>4</th>
            <th>5</th>
            <th>6</th>
        </tr>
        <tr>
            <th>7</th>
            <th>8</th>
            <th>9</th>
        </tr>
    </table>
    <hr>
    <table border="2">
        <tr>
            <th>메뉴 이름</th>
            <th>메뉴 가격</th>
            <th>판매 상태</th>
        </tr>
        <tr>
            <th>마라탕</th>
            <th>13000</th>
            <th>Y</th>
        </tr>
        <tr>
            <th>냉면</th>
            <th>12000</th>
            <th>N</th>
        </tr>
        <tr>
            <th>마라샹궈</th>
            <th>18000</th>
            <th>Y</th>
        </tr>
    </table>
    <hr>
    <!-- 
        th 태그의 속성을 이용해서 
        행과 열을 합칠 수 있다.
        colspan: 열 합치기
        rowspan: 행 합치기
    -->

    <table border="2">
        <caption> 회원 이력서 </caption>
        <tr>
            <td colspan="2" rowspan="2" width="130px" height="150px">사진</td>></td>
            <td width="80px">이름</td>
            <td width="200px"></td>
        </tr>
        <tr>
            <td>연락처</td>
            <td></td>
        </tr>
        <tr>
            <td>주소</td>
            <td colspan="3"></td>
        </tr>


    </table>
</body>
</html>
